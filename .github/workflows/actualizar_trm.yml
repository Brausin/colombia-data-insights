name: Actualizar TRM diario

on:
  schedule:
    - cron: "0 14 * * 1-5"   # lunes a viernes a las 9AM Colombia (UTC-5)
  workflow_dispatch:

jobs:
  actualizar-trm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests pandas

      - name: Obtener TRM del día
        run: python scripts/actualizar_trm.py

      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/tasa_cambio_usd_cop.csv
          git diff --staged --quiet || git commit -m "Actualiza TRM: $(date +%Y-%m-%d)"
          git push
